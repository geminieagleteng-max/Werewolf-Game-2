name: Deploy Werewolf Frontend to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 設定 GITHUB_TOKEN 權限以允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 限制同時間只能運行一次部署
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: 安裝前端依賴
        run: |
          cd client
          npm ci

      - name: 打包 React + Vite 前端 (Build)
        run: |
          cd client
          npm run build

      - name: 上傳 GitHub Pages 構建產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署至 GitHub Pages (Deploy)
        id: deployment
        uses: actions/deploy-pages@v4
